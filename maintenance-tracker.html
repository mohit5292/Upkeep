<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upkeep">
<meta name="theme-color" content="#14181c">
<title>Upkeep</title>
<style>
  :root{
    --bg: #14181c;
    --panel: #1c2128;
    --panel-2: #232933;
    --line: #2c333d;
    --text: #e9ecef;
    --text-dim: #9aa4b2;
    --brass: #c68f4a;
    --brass-bright: #e0a75e;
    --ok: #5fae7a;
    --warn: #d9a441;
    --overdue: #d9634b;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 8px;
    padding-top:calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left:calc(env(safe-area-inset-left, 0px) + 16px);
    padding-right:calc(env(safe-area-inset-right, 0px) + 16px);
  }
  header{margin-bottom:20px;}
  h1{
    font-size:22px;
    font-weight:650;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim);font-size:13.5px;line-height:1.5;margin:0;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
  }
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .task-name{font-size:16px;font-weight:600;margin:0 0 2px;}
  .task-interval{color:var(--text-dim);font-size:12.5px;}
  .status-pill{
    font-size:11.5px;
    font-family:var(--mono);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
    margin-top:2px;
  }
  .status-ok{background:rgba(95,174,122,0.15);color:var(--ok);}
  .status-warn{background:rgba(217,164,65,0.15);color:var(--warn);}
  .status-overdue{background:rgba(217,99,75,0.15);color:var(--overdue);}

  .task-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .due-label{font-size:11.5px;color:var(--text-dim);}
  .due-date{font-family:var(--mono);font-size:14px;margin-top:2px;}

  .btn-row{display:flex;gap:8px;margin-top:12px;}
  button{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    border:none;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:active{opacity:0.7;}
  .btn-primary{background:var(--brass);color:#1c1207;flex:1;}
  .btn-ghost{background:var(--panel-2);color:var(--text-dim);}
  .btn-danger-text{background:none;color:var(--text-dim);padding:9px 4px;font-weight:500;}

  .edit-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .edit-row label{font-size:12px;color:var(--text-dim);flex-shrink:0;}
  input[type="date"], input[type="text"], input[type="number"]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 9px;
    font-family:var(--sans);
    font-size:13.5px;
    width:100%;
  }

  .add-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-top:6px;
    margin-bottom:20px;
  }
  .add-panel h2{font-size:14px;margin:0 0 12px;font-weight:600;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}

  .add-toggle{
    width:100%;
    background:var(--panel-2);
    color:var(--brass-bright);
    border:1px dashed var(--line);
    padding:12px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:10px;
  }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:40px 20px;
    border:1px dashed var(--line);
    border-radius:10px;
  }
  .loading{text-align:center;color:var(--text-dim);padding:30px;font-size:13px;}
  select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 9px;
    font-family:var(--sans);
    font-size:13.5px;
    width:100%;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Upkeep</h1>
    <p class="sub">Mark things done when you actually do them — the next due date shifts from that day, not a fixed calendar slot.</p>
  </header>

  <div id="content"><div class="loading">Loading your tasks…</div></div>

  <button class="add-toggle" id="addToggle" style="display:none;">+ Add a task</button>
  <div class="add-panel" id="addPanel" style="display:none;"></div>
</div>

<script>
const STORE_KEY = 'upkeep-tasks-v1';
let tasks = [];
let addOpen = false;

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

function addMonths(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  // handle month-length overflow (e.g. Jan 31 + 1mo)
  if(d.getDate() < day) d.setDate(0);
  return d.toISOString().slice(0,10);
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function daysUntil(dateStr){
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function statusFor(dateStr){
  const diff = daysUntil(dateStr);
  if(diff < 0) return {cls:'status-overdue', label: Math.abs(diff) + 'd overdue'};
  if(diff === 0) return {cls:'status-warn', label:'due today'};
  if(diff <= 10) return {cls:'status-warn', label:'due in ' + diff + 'd'};
  return {cls:'status-ok', label: diff + 'd left'};
}

function loadTasks(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    tasks = raw ? JSON.parse(raw) : defaultTasks();
    if(!raw) saveTasks();
  }catch(e){
    tasks = defaultTasks();
  }
  render();
}

function defaultTasks(){
  const today = todayStr();
  return [
    {id: uid(), name:'HVAC filter', intervalMonths:3, lastDone: today, nextDue: addMonths(today,3)},
    {id: uid(), name:'Water pitcher filter', intervalMonths:2, lastDone: today, nextDue: addMonths(today,2)}
  ];
}

function saveTasks(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
  }catch(e){
    console.error('save failed', e);
  }
}

function markDone(id, doneDateOverride){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  const doneDate = doneDateOverride || todayStr();
  t.lastDone = doneDate;
  t.nextDue = addMonths(doneDate, t.intervalMonths);
  saveTasks();
  render();
}

function updateNextDue(id, newDate){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  t.nextDue = newDate;
  saveTasks();
  render();
}

function deleteTask(id){
  tasks = tasks.filter(x => x.id !== id);
  saveTasks();
  render();
}

function render(){
  const content = document.getElementById('content');
  const addToggle = document.getElementById('addToggle');
  addToggle.style.display = 'block';

  if(tasks.length === 0){
    content.innerHTML = '<div class="empty">No tasks yet. Add your first one below — HVAC filter, water filter, anything on a cycle.</div>';
    return;
  }

  const sorted = [...tasks].sort((a,b) => daysUntil(a.nextDue) - daysUntil(b.nextDue));

  content.innerHTML = sorted.map(t => {
    const s = statusFor(t.nextDue);
    return `
    <div class="card">
      <div class="task-top">
        <div>
          <p class="task-name">${escapeHtml(t.name)}</p>
          <p class="task-interval">every ${t.intervalMonths} month${t.intervalMonths === 1 ? '' : 's'}</p>
        </div>
        <span class="status-pill ${s.cls}">${s.label}</span>
      </div>
      <div class="task-meta">
        <div>
          <div class="due-label">next due</div>
          <div class="due-date">${fmtDate(t.nextDue)}</div>
        </div>
        <div style="text-align:right;">
          <div class="due-label">last done</div>
          <div class="due-date">${fmtDate(t.lastDone)}</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="markDone('${t.id}')">Changed it today</button>
        <button class="btn-ghost" onclick="toggleEdit('${t.id}')">Edit</button>
      </div>
      <div id="edit-${t.id}" style="display:none;">
        <div class="edit-row">
          <label>Changed on</label>
          <input type="date" id="doneDate-${t.id}" value="${todayStr()}">
          <button class="btn-ghost" onclick="applyCustomDone('${t.id}')">Set</button>
        </div>
        <div class="edit-row">
          <label>Or set next due directly</label>
          <input type="date" id="nextDate-${t.id}" value="${t.nextDue}">
          <button class="btn-ghost" onclick="applyNextDue('${t.id}')">Set</button>
        </div>
        <div class="btn-row">
          <button class="btn-danger-text" onclick="deleteTask('${t.id}')">Delete task</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleEdit(id){
  const el = document.getElementById('edit-' + id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function applyCustomDone(id){
  const val = document.getElementById('doneDate-' + id).value;
  if(val) markDone(id, val);
}

function applyNextDue(id){
  const val = document.getElementById('nextDate-' + id).value;
  if(val) updateNextDue(id, val);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('addToggle').addEventListener('click', () => {
  addOpen = !addOpen;
  renderAddPanel();
});

function renderAddPanel(){
  const panel = document.getElementById('addPanel');
  const toggle = document.getElementById('addToggle');
  panel.style.display = addOpen ? 'block' : 'none';
  toggle.textContent = addOpen ? '– Close' : '+ Add a task';
  if(!addOpen) return;

  panel.innerHTML = `
    <h2>New task</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="newName" placeholder="e.g. Fridge water filter">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Repeat every</label>
        <input type="number" id="newInterval" min="1" value="2">
      </div>
      <div class="field">
        <label>Unit</label>
        <select id="newUnit">
          <option value="1">month(s)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Last changed on</label>
      <input type="date" id="newLastDone" value="${todayStr()}">
    </div>
    <button class="btn-primary" style="width:100%;" onclick="submitNewTask()">Add task</button>
  `;
}

function submitNewTask(){
  const name = document.getElementById('newName').value.trim();
  const interval = parseInt(document.getElementById('newInterval').value, 10);
  const lastDone = document.getElementById('newLastDone').value;
  if(!name || !interval || !lastDone) return;
  tasks.push({
    id: uid(),
    name,
    intervalMonths: interval,
    lastDone,
    nextDue: addMonths(lastDone, interval)
  });
  saveTasks();
  addOpen = false;
  renderAddPanel();
  render();
}

// Recalculate countdowns whenever the app is reopened or brought back
// to the foreground, so "days left" is never stale.
let lastRenderDay = todayStr();

function refreshIfStale(){
  const now = todayStr();
  if(now !== lastRenderDay){
    lastRenderDay = now;
  }
  render();
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden) refreshIfStale();
});
window.addEventListener('pageshow', refreshIfStale);
window.addEventListener('focus', refreshIfStale);

loadTasks();
</script>
</body>
</html>
